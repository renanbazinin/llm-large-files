name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed. See docs/publishing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache when publishing: a poisoned cache could expose the publish token.
          package-manager-cache: false
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run check
      # Uses trusted publishing when configured on npmjs.com; otherwise the NPM_TOKEN secret.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
